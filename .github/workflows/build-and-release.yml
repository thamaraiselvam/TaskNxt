name: Build and Release macOS App

# Builds TaskNxt.app as a universal (Apple Silicon + Intel) binary, packages
# it into a distributable, double-clickable .dmg, and:
#   - on every push/PR: builds + runs tests, uploads the .dmg as a workflow
#     artifact so it can be sanity-checked without cutting a release.
#   - on a pushed tag matching v*.*.*: additionally publishes a GitHub
#     Release with the universal .dmg attached.
#
# All packaging logic lives in this workflow (no separate CI-only shell
# scripts) so the whole release pipeline is visible and editable in one
# place.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  APP_NAME: TaskNxt

jobs:
  build:
    name: Build, test, and package
    # macos-14's default Xcode (15.4) doesn't ship the Swift `Testing`
    # module used by the test target; macos-15 defaults to Xcode 16.4,
    # which does.
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg_name: ${{ steps.release.outputs.dmg_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp app version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_VERSION="${VERSION%%-*}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SHORT_VERSION" Sources/TaskNxt/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Sources/TaskNxt/App/Info.plist

      - name: Build universal release binary (arm64 + x86_64)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble TaskNxt.app bundle
        run: |
          set -euo pipefail
          BUILD_DIR=".build/apple/Products/release"
          APP_BUNDLE=".build/${APP_NAME}.app"

          rm -rf "$APP_BUNDLE"
          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"

          cp "$BUILD_DIR/${APP_NAME}" "$APP_BUNDLE/Contents/MacOS/${APP_NAME}"
          cp "Sources/TaskNxt/App/Info.plist" "$APP_BUNDLE/Contents/Info.plist"

          for res in "$BUILD_DIR"/*.bundle; do
            [ -e "$res" ] && cp -R "$res" "$APP_BUNDLE/Contents/Resources/"
          done

          echo "==> Verifying universal binary architectures"
          lipo -archs "$APP_BUNDLE/Contents/MacOS/${APP_NAME}"

      - name: Generate app icon (.icns)
        run: |
          set -euo pipefail
          APP_BUNDLE=".build/${APP_NAME}.app"
          ICONSET_SRC="Resources/Assets.xcassets/AppIcon.appiconset"
          ICONSET_TMP="$(mktemp -d)/AppIcon.iconset"

          cp -R "$ICONSET_SRC" "$ICONSET_TMP"
          rm -f "$ICONSET_TMP/Contents.json"
          iconutil -c icns "$ICONSET_TMP" -o "$APP_BUNDLE/Contents/Resources/AppIcon.icns"

      - name: Import Developer ID certificate
        id: cert
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE_P12_BASE64:-}" ]; then
            echo "No Developer ID certificate configured; app will be ad-hoc signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make this keychain visible to codesign without clobbering the
          # runner's default keychain search list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o '"Developer ID Application:.*"' | head -1 | tr -d '"')"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          rm -f "$CERT_PATH"

      - name: Sign app bundle
        run: |
          set -euo pipefail
          if [ "${{ steps.cert.outputs.signed }}" = "true" ]; then
            echo "==> Signing with Developer ID identity"
            codesign --force --deep --options runtime --timestamp \
              --entitlements "Sources/TaskNxt/App/TaskNxt.entitlements" \
              --sign "${{ steps.cert.outputs.identity }}" \
              ".build/${APP_NAME}.app"
          else
            echo "==> Ad-hoc signing (no Developer ID certificate configured)"
            codesign --force --deep --sign - ".build/${APP_NAME}.app"
          fi
          codesign --verify --deep --strict --verbose=2 ".build/${APP_NAME}.app"

      - name: Notarize app bundle
        if: steps.cert.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_BUNDLE=".build/${APP_NAME}.app"
          ZIP_PATH="$RUNNER_TEMP/${APP_NAME}-notarize.zip"

          ditto -c -k --keepParent "$APP_BUNDLE" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$APP_BUNDLE"
          xcrun stapler validate "$APP_BUNDLE"

      - name: Clean up signing keychain
        if: always() && steps.cert.outputs.signed == 'true'
        run: security delete-keychain "${{ steps.cert.outputs.keychain_path }}" || true

      - name: Create installable .dmg
        run: |
          set -euo pipefail
          APP_BUNDLE=".build/${APP_NAME}.app"
          STAGING_DIR="$(mktemp -d)/dmg-staging"
          DMG_NAME="${APP_NAME}-${{ steps.version.outputs.version }}.dmg"

          mkdir -p "$STAGING_DIR"
          cp -R "$APP_BUNDLE" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            ".build/$DMG_NAME"

          echo "DMG_PATH=.build/$DMG_NAME" >> "$GITHUB_ENV"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: app/${{ env.DMG_PATH }}
          retention-days: 14

      - name: Record release outputs
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        run: echo "dmg_name=${DMG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="$(mktemp)"

          # Prefer the matching CHANGELOG.md section (curated by release-please)
          # over --generate-notes, which lists raw merged PRs and surfaces noisy
          # internal ones (e.g. the release-please version-bump PR itself).
          python3 - "$VERSION" "../CHANGELOG.md" > "$NOTES_FILE" <<'PY'
          import re, sys
          version, path = sys.argv[1], sys.argv[2]
          try:
              text = open(path).read()
          except FileNotFoundError:
              sys.exit(0)
          m = re.search(r'^##\s+\[?' + re.escape(version) + r'\]?\b.*$', text, re.MULTILINE)
          if not m:
              sys.exit(0)
          start = m.end()
          nxt = re.search(r'^##\s+', text[start:], re.MULTILINE)
          end = start + nxt.start() if nxt else len(text)
          print(text[start:end].strip())
          PY

          # Idempotent: replace any existing release under this tag (keeps the tag itself).
          gh release delete "$TAG" --yes 2>/dev/null || true

          if [ -s "$NOTES_FILE" ]; then
            gh release create "$TAG" \
              "${DMG_PATH}#${APP_NAME} universal installer (Apple Silicon + Intel)" \
              --title "${APP_NAME} ${VERSION}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              "${DMG_PATH}#${APP_NAME} universal installer (Apple Silicon + Intel)" \
              --title "${APP_NAME} ${VERSION}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      # `brew tap` clones into Homebrew's own managed directory
      # ($(brew --repository thamaraiselvam/tasknxt)) rather than operating on
      # whatever path/URL you give it - and `brew bump-cask-pr` always edits
      # that managed clone, never an unrelated actions/checkout'd folder. So
      # we tap directly from GitHub (embedding the token in the remote URL
      # for push access) and commit/push from that same managed clone,
      # instead of checking out the tap separately and expecting bump-cask-pr
      # to edit it.
      - name: Tap thamaraiselvam/homebrew-tasknxt (with push access)
        run: |
          brew tap thamaraiselvam/tasknxt \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/thamaraiselvam/homebrew-tasknxt.git"
          echo "TAP_DIR=$(brew --repository thamaraiselvam/tasknxt)" >> "$GITHUB_ENV"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump Cask (write-only, no PR)
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          DMG_NAME="${{ needs.build.outputs.dmg_name }}"
          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${DMG_NAME}"

          brew bump-cask-pr \
            --write-only \
            --no-audit \
            --no-browse \
            --version="$VERSION" \
            --url="$DMG_URL" \
            thamaraiselvam/tasknxt/tasknxt
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Commit and push updated Cask
        working-directory: ${{ env.TAP_DIR }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No Cask changes to commit."
            exit 0
          fi
          git add Casks/tasknxt.rb
          git commit -m "chore: update tasknxt to ${{ needs.build.outputs.version }}"
          git push origin HEAD:main
